[project]
name = "firebreak"
version = "0.1.0"
description = "AI incident commander on a FalkorDB knowledge graph"
requires-python = ">=3.12"
dependencies = [
    "falkordb==1.2.0",
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "pydantic==2.11.4",
    "python-dotenv==1.1.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firebreak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
