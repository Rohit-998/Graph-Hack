name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Unit + integration tests (Cypher runs against FalkorDB)
        run: uv run pytest -v
      - name: Acceptance gate (deterministic, LLM_PROVIDER=none)
        run: uv run python -m firebreak.cli acceptance
      # PRD 15 demo-reliability gate: three consecutive deterministic runs must pass.
      - name: Acceptance gate x3 (reliability)
        run: |
          for i in 1 2 3; do
            echo "--- run $i ---"
            uv run python -m firebreak.cli acceptance
          done
      # Same engine, different domain: proves the RCA is not tuned to the demo world.
      - name: "Acceptance gate (second world: meridian)"
        run: uv run python -m firebreak.cli acceptance --world meridian

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
